<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Video Automator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Music Video Automator</h1>
            <p>From prompt to production.</p>
        </header>

        <main id="timeline">
            <!-- Row 1: Inputs -->
            <section class="row active" id="row-inputs">
                <div class="row-header">
                    <span class="step-number">1</span>
                    <h2>Project Configuration</h2>
                </div>
                <div class="row-content">
                    <div class="input-group">
                        <label for="topic">Topic</label>
                        <textarea id="topic" placeholder="e.g., A rousing march celebrating Fremont California"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="style">Style</label>
                        <textarea id="style" placeholder="e.g., 1950s big band with a chorus, horns, and a harp solo"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="quality">Quality</label>
                        <select id="quality">
                            <option value="low">Low (Fast Preview)</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High (Production)</option>
                        </select>
                    </div>
                    <button id="btn-start" class="primary-btn">Start Production</button>
                </div>
            </section>

            <!-- Dynamic Rows will be injected here -->
            <div id="dynamic-rows"></div>
        </main>
    </div>

    <!-- Templates for Dynamic Rows -->
    <template id="step-row-template">
        <section class="row">
            <div class="row-header">
                <span class="step-status"></span>
                <h2 class="step-title"></h2>
                <div class="step-progress-bar"><div class="progress-fill"></div></div>
            </div>
            <div class="row-content">
                <div class="content-display"></div>
                <div class="row-actions">
                    <button class="edit-btn">Edit</button>
                    <button class="regen-btn">Regenerate From Here</button>
                </div>
            </div>
        </section>
    </template>

    <script src="app.js"></script>
</body>
</html>
