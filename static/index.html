<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC VIDEO AUTOMATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>MUSIC VIDEO AUTOMATOR</h1>
            <p>PROMPT TO PRODUCTION</p>
        </header>

        <main id="timeline">
            <section class="row active" id="row-inputs">
                <div class="row-header">
                    <span class="step-number">01</span>
                </div>
                <div class="row-content">
                    <h2>PROJECT CONFIGURATION</h2>
                    <div class="input-group">
                        <label for="topic">TOPIC</label>
                        <textarea id="topic" placeholder="e.g., A rousing march celebrating Fremont California"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="style">STYLE</label>
                        <textarea id="style" placeholder="e.g., 1950s big band with a chorus, horns, and a harp solo"></textarea>
                    </div>
                    <div class="input-group">
                        <label for="quality">QUALITY</label>
                        <select id="quality">
                            <option value="low">LOW — FAST PREVIEW</option>
                            <option value="medium" selected>MEDIUM</option>
                            <option value="high">HIGH — PRODUCTION</option>
                        </select>
                    </div>
                    <button id="btn-start" class="primary-btn">START PRODUCTION</button>
                </div>
                <div class="step-progress-bar"><div class="progress-fill"></div></div>
            </section>

            <div id="dynamic-rows"></div>
        </main>
    </div>

    <template id="step-row-template">
        <section class="row">
            <div class="row-header">
                <span class="step-indicator"><span class="step-status"></span></span>
                <h2 class="step-title"></h2>
            </div>
            <div class="row-content">
                <div class="content-display"></div>
                <div class="row-actions">
                    <button class="edit-btn">EDIT</button>
                    <button class="regen-btn">REGENERATE FROM HERE</button>
                </div>
            </div>
            <div class="step-progress-bar"><div class="progress-fill"></div></div>
        </section>
    </template>

    <script src="app.js"></script>
</body>
</html>
